# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    # 公開直後の版は取り下げや乗っ取りの可能性があるので、JS の依存 (bunfig.toml の minimumReleaseAge) と同じく 7 日待つ。
    cooldown:
      default-days: 7

  # JS の依存は対象にしない。Dependabot は bun.lock (lockfileVersion 3) を読めず、npm の種別では
  # bun.lock を更新しないため、どちらでも PR が成立しない。更新は .github/workflows/update-deps.yml で行う。
