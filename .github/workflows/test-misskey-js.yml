name: Test (misskey.js)

on:
  push:
    branches: [develop]
    paths:
      - packages/misskey-js/**
      - .github/workflows/test-misskey-js.yml
  pull_request:
    branches: [develop]
    paths:
      - packages/misskey-js/**
      - .github/workflows/test-misskey-js.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (misskey.js)

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check bun.lock
        run: git diff --exit-code bun.lock

      - name: Build
        run: bun run --bun --filter misskey-js build

      - name: Test
        run: bun run --bun --filter misskey-js test
        env:
          CI: true

      # WebSocket の実装は実行環境ごとに挙動が違う (Bun は ws を独自実装へ差し替え、Node の組み込み
      # WebSocket は接続中の close() で close を同期に発火する)。同じテストを Node でも通す。
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test (Node.js)
        run: bun run --filter misskey-js test:node
        env:
          CI: true
