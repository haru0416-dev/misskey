# this name is used in report-api-diff.yml so be careful when change name
name: Get api.json from Misskey

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - .github/workflows/get-api-diff.yml
jobs:
  get-from-misskey:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        api-json-name: [api-base.json, api-head.json]
        include:
          - api-json-name: api-base.json
            ref: ${{ github.base_ref }}
          - api-json-name: api-head.json
            ref: refs/pull/${{ github.event.number }}/merge

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ matrix.ref }}
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .config/example.yml .config/default.yml
      - name: Build
        run: bun run build
      - name: Generate API JSON
        run: bun run --bun --filter backend generate-api-json
      - name: Copy API.json
        run: cp packages/backend/built/api.json ${{ matrix.api-json-name }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-artifact-${{ matrix.api-json-name }}
          path: ${{ matrix.api-json-name }}

  save-pr-number:
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "$PR_NUMBER" > ./pr_number
      - uses: actions/upload-artifact@v7
        with:
          name: api-artifact-pr-number
          path: pr_number
