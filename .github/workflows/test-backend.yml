name: Test (backend)

on:
  push:
    branches:
      - master
      - develop
    # backend の workspace 依存 (i18n / mfm-js / misskey-js / slacc) と Bun の版を変えたときも走らせる。
    paths: &backend-paths
      - packages/backend/**
      - packages/i18n/**
      - packages/mfm-js/**
      - packages/misskey-js/**
      - packages/slacc/**
      - .github/workflows/test-backend.yml
      - .github/misskey/test.yml
      - bun.lock
      - bunfig.toml
      - .bun-version
      - package.json
  pull_request:
    paths: *backend-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      valkey:
        image: valkey/valkey:8
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install FFmpeg
        run: |
          sudo apt install -y ffmpeg
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        # backend とその依存だけをビルドし、単体テストに不要な frontend の Vite ビルドを省く。
        run: bun run build-pre && bun run build:backend-deps && bun run --bun --filter backend build
      - name: Test
        # CI ではカバレッジを取らない (手元では test-and-coverage で Bun 上でも取れる)
        run: bun run --bun --filter backend test

  e2e:
    name: E2E tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      valkey:
        image: valkey/valkey:8
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build
      - name: Test
        # CI ではカバレッジを取らない (手元では test-and-coverage で Bun 上でも取れる)
        run: bun run --bun --filter backend test:e2e

  e2e-bun:
    name: E2E tests (backend, bun target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      valkey:
        image: valkey/valkey:8
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build
      - name: Test
        # 通常の e2e は Bun 上のテストプロセス内でサーバーを起動する。
        # 別プロセスで起動し、設定・起動終了・HTTP 通信のプロセス境界も検証する。
        run: bun run --bun --filter backend test:e2e:bun

  migration:
    name: Migration tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Get current date
        id: current-date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        # migration実行に必要なのはbackendとその依存のみ
        run: bun run build-pre && bun run build:backend-deps && bun run --bun --filter backend build
      - name: Check schema and migration consistency
        run: |
          MISSKEY_CONFIG_YML=test.yml bun run --filter backend db:generate
          status=$(git status --porcelain --untracked-files=all -- packages/backend/migration)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo 'Schema and committed migrations are out of sync.' >&2
            exit 1
          fi
      - name: Run migrations
        run: MISSKEY_CONFIG_YML=test.yml bun run --bun --filter backend migrate
      - name: Check no migrations are remaining
        run: MISSKEY_CONFIG_YML=test.yml bun run --bun --filter backend check-migrations
