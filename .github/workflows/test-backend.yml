name: Test (backend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - packages/mfm-js/**
      # 権限関連
      - packages/misskey-js/**
      - .github/workflows/test-backend.yml
      - .github/misskey/test.yml
      - bun.lock
      - package.json
  pull_request:
    paths:
      - packages/backend/**
      - packages/mfm-js/**
      # 権限関連
      - packages/misskey-js/**
      - .github/workflows/test-backend.yml
      - .github/misskey/test.yml
      - bun.lock
      - package.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      valkey:
        image: valkey/valkey:8
        ports:
          - 56312:6379
      meilisearch:
        image: getmeili/meilisearch:v1.42.1
        ports:
          - 57712:7700
        env:
          MEILI_NO_ANALYTICS: true
          MEILI_ENV: development

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install FFmpeg
        run: |
          sudo apt install -y ffmpeg
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        # backend単体テストにフロントエンドのviteビルドは不要。backendが参照する
        # i18n / misskey-js だけをビルドする (backend本体はテストスクリプトがビルドする)
        run: bun run build-pre && bun run build:backend-deps && bun run --bun --filter backend build
      - name: Test
        # v8 coverage は Node の inspector API 依存で Bun ランタイムでは動かないため、カバレッジ無しで実行する
        run: bun run --bun --filter backend test

  e2e:
    name: E2E tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      valkey:
        image: valkey/valkey:8
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build
      - name: Test
        # v8 coverage は Node の inspector API 依存で Bun ランタイムでは動かないため、カバレッジ無しで実行する
        run: bun run --bun --filter backend test:e2e

  e2e-bun:
    name: E2E tests (backend, bun target)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      valkey:
        image: valkey/valkey:8
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build
      - name: Test
        # e2e ジョブは vitest と同じ Node.js プロセスにサーバーを立てるため、本番の
        # bun ランタイム + Bun.sql ドライバの経路が一切通らない。こちらはサーバーだけ
        # bun の別プロセスとして起動し、本番と同じ構成で e2e を通す
        run: bun run --bun --filter backend test:e2e:bun

  migration:
    name: Migration tests (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Get current date
        id: current-date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        # migration実行に必要なのはbackendとその依存のみ
        run: bun run build-pre && bun run build:backend-deps && bun run --bun --filter backend build
      - name: Check schema and migration consistency
        run: |
          MISSKEY_CONFIG_YML=test.yml bun run --filter backend db:generate
          status=$(git status --porcelain --untracked-files=all -- packages/backend/migration)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo 'Schema and committed migrations are out of sync.' >&2
            exit 1
          fi
      - name: Run migrations
        run: MISSKEY_CONFIG_YML=test.yml bun run --bun --filter backend migrate
      - name: Check no migrations are remaining
        run: MISSKEY_CONFIG_YML=test.yml bun run --bun --filter backend check-migrations
