name: Test (frontend)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/frontend/**
      - packages/frontend-shared/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - playwright/**
      - playwright.config.ts
      - package.json
      - bun.lock
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
  pull_request:
    paths:
      - packages/frontend/**
      - packages/frontend-shared/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - playwright/**
      - playwright.config.ts
      - package.json
      - bun.lock
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        # フロントエンド単体テストはviteの本番ビルド成果物を使わない。
        # 参照される i18n / icons-subsetter / misskey-js だけをビルドする
        run: bun run build-pre && bun run build:frontend-deps
      - name: Test
        run: bun run --bun --filter frontend test

  e2e:
    name: E2E tests (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build
      - name: Install Playwright browsers
        run: bun run playwright:install
      - name: Playwright run
        timeout-minutes: 15
        run: bun run pw:run -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.browser }}-playwright-report
          path: playwright-report
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ matrix.browser }}-playwright-test-results
          path: test-results
