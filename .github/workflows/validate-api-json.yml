name: api.json validation

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - .github/workflows/validate-api-json.yml
  pull_request:
    paths:
      - packages/backend/**
      - .github/workflows/validate-api-json.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-api-json:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # example.yml は setupPassword を環境変数から読む。CI はサーバーを起動するだけなので固定値でよい
      TONERIKO_SETUP_PASSWORD: ci-generate-api-json
      DATABASE_PASSWORD: ci-generate-api-json

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Copy Configure
        run: cp .config/example.yml .config/default.yml
      - name: Build and generate
        run: bun run build && bun run --bun --filter backend generate-api-json
      - name: Validation
        run: bunx @redocly/cli lint --extends=minimal ./packages/backend/built/api.json
