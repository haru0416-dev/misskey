name: Check Misskey JS autogen

# API 定義から misskey-js の型を生成し直し、リポジトリにある生成物と一致するか確かめる。
# PR のコードをビルドして実行するので pull_request で動かす。pull_request_target では base のキャッシュと
# 書き込み権限のある token の下で PR のコードが動いてしまう。
# develop へ直接 push した変更も同じく確かめる。
on:
  push:
    branches:
      - develop
    paths:
      - packages/backend/**
      - packages/misskey-js/generator/**
      - packages/misskey-js/src/autogen/**
      - .github/workflows/check-misskey-js-autogen.yml
  pull_request:
    paths:
      - packages/backend/**
      - packages/misskey-js/generator/**
      - packages/misskey-js/src/autogen/**
      - .github/workflows/check-misskey-js-autogen.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # example.yml は setupPassword を環境変数から読む。API 定義を書き出すだけなので固定値でよい
      TONERIKO_SETUP_PASSWORD: ci-generate-api-json
      DATABASE_PASSWORD: ci-generate-api-json
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の読み込みに必要。
        run: bun run --filter slacc build

      - name: Copy Config
        run: cp .config/example.yml .config/default.yml
      # build-misskey-js-with-types のうち、生成物の比較に要る段だけを実行する。
      - name: Build backend
        run: |
          bun run build-pre
          bun run build:backend-deps
          bun run --bun --filter backend build
      - name: Generate misskey-js types
        run: |
          bun run --bun --filter backend generate-api-json --no-build
          cp packages/backend/built/api.json packages/misskey-js/generator/api.json
          bun run --bun --filter misskey-js update-autogen-code

      - name: Compare with the committed files
        run: |
          git add -N packages/misskey-js/src/autogen
          if ! git diff --exit-code --stat packages/misskey-js/src/autogen; then
            git diff packages/misskey-js/src/autogen
            echo '::error::misskey-js の型が API 定義と一致しません。bun run build-misskey-js-with-types を実行して生成物をコミットしてください。'
            exit 1
          fi
