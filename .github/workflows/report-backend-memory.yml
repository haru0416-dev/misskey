name: Report backend memory

on:
  workflow_run:
    types: [completed]
    workflows:
      - Get backend memory usage # get-backend-memory.yml

jobs:
  compare-memory:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: memory-artifact-*
          path: artifacts
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Check artifacts
        run: ls -lh artifacts/
      - name: Find head heap snapshot artifact
        id: find-heap-snapshot-artifact
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.payload.workflow_run.id;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id,
            });
            const artifact = artifacts.find(artifact => artifact.name === 'backend-memory-head-heap-snapshot');
            if (artifact == null) return;
            core.setOutput('url', `https://github.com/${owner}/${repo}/actions/runs/${run_id}/artifacts/${artifact.id}`);

      - id: build-comment
        name: Build memory comment
        env:
          MK_MEMORY_HEAP_SNAPSHOT_ARTIFACT_URL_HEAD: ${{ steps.find-heap-snapshot-artifact.outputs.url }}
        run: bun .github/scripts/backend-memory-report.mts ./artifacts/memory-base.json ./artifacts/memory-head.json ./output.md ./artifacts/js-footprint-base.json ./artifacts/js-footprint-head.json
      - name: Validate pull request target
        id: validate-pr
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const workflowRun = context.payload.workflow_run;
            const rawPrNumber = fs.readFileSync('artifacts/pr_number', 'utf8').trim();
            if (!/^\d+$/.test(rawPrNumber)) {
              core.setFailed('The artifact pull request number is invalid.');
              return;
            }

            const prNumber = Number(rawPrNumber);
            const associatedPullRequests = workflowRun.pull_requests ?? [];
            const runHeadSha = workflowRun.head_sha;
            const associatedPullRequest = associatedPullRequests.find(pr =>
              pr.number === prNumber && pr.head?.sha === runHeadSha);
            if (associatedPullRequest == null) {
              core.setFailed(`Workflow run ${workflowRun.id} is associated with a different pull request or head.`);
              return;
            }

            const { owner, repo } = context.repo;
            const currentPullRequest = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            if (currentPullRequest.data.head?.sha !== runHeadSha) {
              core.setFailed(`Pull request #${prNumber} no longer has workflow run head ${runHeadSha}.`);
              return;
            }
            if (currentPullRequest.data.base.repo?.full_name !== `${owner}/${repo}` ||
                currentPullRequest.data.head.repo?.full_name !== workflowRun.head_repository?.full_name) {
              core.setFailed(`Pull request #${prNumber} repository identity does not match workflow run ${workflowRun.id}.`);
              return;
            }

            core.setOutput('pr-number', String(prNumber));
      - uses: thollander/actions-comment-pull-request@v3
        if: success() && steps.validate-pr.outputs.pr-number
        with:
          pr-number: ${{ steps.validate-pr.outputs.pr-number }}
          comment-tag: show_memory_diff
          file-path: ./output.md
      - name: Tell error to PR
        uses: thollander/actions-comment-pull-request@v3
        if: failure() && steps.validate-pr.outputs.pr-number
        with:
          pr-number: ${{ steps.validate-pr.outputs.pr-number }}
          comment-tag: show_memory_diff_error
          message: |
            An error occurred while comparing backend memory usage. See [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
