name: Check Migration History

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/migration/**
      - .github/scripts/check-migration-history.mjs
      - .github/scripts/check-migration-history.test.mjs
      - .github/workflows/check-migration-history.yml
  pull_request:
    paths:
      - packages/backend/migration/**
      - .github/scripts/check-migration-history.mjs
      - .github/scripts/check-migration-history.test.mjs
      - .github/workflows/check-migration-history.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Test migration history checker
        run: bun test ./.github/scripts/check-migration-history.test.mjs
      - name: Reject edits to existing migrations
        run: bun .github/scripts/check-migration-history.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"
