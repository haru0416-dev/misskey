name: Check Migration History

on:
  pull_request:
    paths:
      - packages/backend/migration/**
      - .github/scripts/check-migration-history.mjs
      - .github/scripts/check-migration-history.test.mjs
      - .github/workflows/check-migration-history.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Test migration history checker
        run: node --test .github/scripts/check-migration-history.test.mjs
      - name: Reject edits to existing migrations
        run: node .github/scripts/check-migration-history.mjs "${{ github.event.pull_request.base.sha }}"
