---
name: Dockle

on:
  push:
    branches:
      - master
      - develop
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dockle:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 56312:6379

    env:
      DOCKER_CONTENT_TRUST: 1
      DOCKLE_VERSION: 0.4.15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download and install dockle v${{ env.DOCKLE_VERSION }}
        run: |
          set -eux
          curl -L -o dockle.deb "https://github.com/goodwithtech/dockle/releases/download/v${DOCKLE_VERSION}/dockle_${DOCKLE_VERSION}_Linux-64bit.deb"
          sudo dpkg -i dockle.deb

      - name: Build web image (docker build)
        run: |
          set -eux
          docker build -t "misskey-web:ci" .
          docker image ls

      - name: Smoke test production image
        run: |
          set -eux
          docker run --disable-content-trust=true --pull=never -d \
            --name misskey-production-ci \
            --network host \
            --mount type=bind,src="$PWD/.github/misskey/test.yml",dst=/misskey/.config/default.yml,readonly \
            misskey-web:ci
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Status}}' misskey-production-ci)
            health=$(docker inspect --format '{{.State.Health.Status}}' misskey-production-ci)
            if [ "$state" = exited ] || [ "$state" = dead ] || [ "$health" = unhealthy ]; then
              docker logs misskey-production-ci
              exit 1
            fi
            if [ "$health" = healthy ]; then
              curl --fail --silent http://127.0.0.1:61812/healthz
              exit 0
            fi
            sleep 5
          done
          docker logs misskey-production-ci
          exit 1

      - name: Stop production image
        if: always()
        run: docker rm --force misskey-production-ci || true

      - name: Mount tmpfs for Dockle tar
        env:
          TMPFS_SIZE: 8G
        run: |
          set -eux
          sudo mkdir -p /mnt/dockle-tmp
          sudo mount -t tmpfs -o size=${{ env.TMPFS_SIZE }} tmpfs /mnt/dockle-tmp
          free -h
          df -h

      - name: Save image tar into tmpfs
        run: |
          set -eux
          docker save misskey-web:ci -o /mnt/dockle-tmp/misskey-web.tar
          ls -lh /mnt/dockle-tmp/misskey-web.tar

      - name: Run Dockle Scan (tar input)
        run: |
          set -eux
          dockle --exit-code 1 --input /mnt/dockle-tmp/misskey-web.tar
