name: Lint

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-shared/**
      - packages/frontend-builder/**
      - packages/frontend-embed/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - .devcontainer/**
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/**
      - .github/*.yml
      - .oxfmtrc.json
      - .oxlintrc.json
      - '*.json'
      - '*.json5'
      - '*.toml'
      - '*.yaml'
      - '*.yml'
      - bun.lock
      - package.json
      - scripts/**
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-shared/**
      - packages/frontend-builder/**
      - packages/frontend-embed/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - .devcontainer/**
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/**
      - .github/*.yml
      - .oxfmtrc.json
      - .oxlintrc.json
      - '*.json'
      - '*.json5'
      - '*.toml'
      - '*.yaml'
      - '*.yml'
      - bun.lock
      - package.json
      - scripts/**
      - .github/workflows/lint.yml
jobs:
  bun_install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

  oxlint:
    needs: [bun_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint:ox

  oxfmt:
    needs: [bun_install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format:ox:check

  typecheck:
    needs: [bun_install]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        workspace:
          - backend
          - frontend
          - sw
          - misskey-js
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build:frontend-deps
      - run: bun run --bun --filter ${{ matrix.workspace }} typecheck
