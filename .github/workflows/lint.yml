name: Lint

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/aiscript/**
      - packages/mfm-js/**
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-embed/**
      - packages/frontend-shared/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - .devcontainer/**
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/**
      - .github/*.yml
      - .oxfmtrc.json
      - .oxlintrc.json
      - '*.json'
      - '*.json5'
      - '*.toml'
      - '*.yaml'
      - '*.yml'
      - bun.lock
      - package.json
      - scripts/**
      - .github/workflows/lint.yml
  pull_request:
    paths:
      - packages/aiscript/**
      - packages/mfm-js/**
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-embed/**
      - packages/frontend-shared/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - .devcontainer/**
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/**
      - .github/*.yml
      - .oxfmtrc.json
      - .oxlintrc.json
      - '*.json'
      - '*.json5'
      - '*.toml'
      - '*.yaml'
      - '*.yml'
      - bun.lock
      - package.json
      - scripts/**
      - .github/workflows/lint.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint:ox

  oxfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run format:ox:check

  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        workspace:
          - '@syuilo/aiscript'
          - mfm-js
          - backend
          - frontend
          - sw
          - misskey-js
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build:frontend-deps
      - run: bun run --bun --filter ${{ matrix.workspace }} typecheck
