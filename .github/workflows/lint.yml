name: Lint

on:
  push:
    branches:
      - master
      - develop
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .claude/**
      - .agents/**
      - .github/copilot-instructions.md
      - docs/agent-workflow-spec.md
      - packages/aiscript/**
      - packages/mfm-js/**
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-embed/**
      - packages/frontend-shared/**
      - packages/i18n/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - .devcontainer/**
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/**
      - .github/workflows/**
      - .github/*.yml
      - .oxfmtrc.json
      - .oxlintrc.json
      - '*.json'
      - '*.json5'
      - '*.toml'
      - '*.yaml'
      - '*.yml'
      - bun.lock
      - package.json
      - scripts/**
      - tests/e2e/**
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .claude/**
      - .agents/**
      - .github/copilot-instructions.md
      - docs/agent-workflow-spec.md
      - packages/aiscript/**
      - packages/mfm-js/**
      - packages/backend/**
      - packages/frontend/**
      - packages/frontend-embed/**
      - packages/frontend-shared/**
      - packages/i18n/**
      - packages/icons-subsetter/**
      - packages/sw/**
      - packages/misskey-js/**
      - .devcontainer/**
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/**
      - .github/workflows/**
      - .github/*.yml
      - .oxfmtrc.json
      - .oxlintrc.json
      - '*.json'
      - '*.json5'
      - '*.toml'
      - '*.yaml'
      - '*.yml'
      - bun.lock
      - package.json
      - scripts/**
      - tests/e2e/**
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun run lint:agent-instructions
      - run: bun test scripts/sync-agent-instructions.test.mjs
      - run: bun run lint:doc-links

  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - run: bun run lint:ox
      # ルートの補助スクリプトのテスト。optimization-environment は backend の比較 CLI を起動するので依存の導入後に回す。
      - run: bun test scripts/dependency-inventory.test.mjs scripts/optimization-environment.test.mjs scripts/spawn-checked.test.mjs scripts/check-federation-known-failures.test.mjs
      # knip は vite / drizzle の設定ファイルを実行して入口を集める。i18n の built と compile 済みの設定が
      # 無いと読み込みに失敗し、そこから辿る schema の enum などを未使用と誤って報告する。
      - run: bun run --filter i18n build
      - name: Compile config
        run: cp .github/misskey/test.yml .config/default.yml && bun run --filter backend compile-config
      # 使われていない export・依存・ファイルは oxlint などでは検出できないので、knip で検査する。
      - run: bun run lint:knip

  oxfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - run: bun run format:ox:check

  vue-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - run: bun run lint:vue-templates

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace:
          - '@syuilo/aiscript'
          - mfm-js
          - backend
          - frontend
          - frontend-embed
          - i18n
          - icons-subsetter
          - sw
          - misskey-js
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - run: bun run build:frontend-deps
      - run: bun run --bun --filter ${{ matrix.workspace }} typecheck
      - if: matrix.workspace == 'frontend'
        run: bun run typecheck:playwright
