name: Test (production install and build)

on:
  push:
    branches:
      - master
      - develop
    paths-ignore: &docs-only
      - '**/*.md'
      - docs/**
      - .claude/**
      - .agents/**
  pull_request:
    paths-ignore: *docs-only

permissions:
  contents: read

env:
  NODE_ENV: production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Check runtime versions
        run: bun run check:runtime-versions
      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Check bun.lock
        run: git diff --exit-code bun.lock
      - name: Check duplicate dependency versions
        run: bun dedupe --check
      # overrides で塞いでいる勧告が、依存更新で外れていないことを見る。
      # `bun dedupe --check` と違い audit は問題があれば非ゼロで終わる。
      - name: Audit dependencies
        run: bun audit
      - name: Test source tarball
        run: bun test ./scripts/tarball.test.mjs
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config/default.yml
      - name: Build
        run: bun run build
