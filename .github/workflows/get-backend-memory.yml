# this name is used in report-backend-memory.yml so be careful when change name
name: Get backend memory usage

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/scripts/utility.mts
      - .github/scripts/backend-memory-report.mts
      - .github/scripts/measure-backend-memory-comparison.mts
      - .github/scripts/backend-js-footprint.mjs
      - .github/scripts/backend-js-footprint-loader.mjs
      - .github/scripts/backend-js-footprint-require.cjs
      - .github/workflows/get-backend-memory.yml
      - .github/workflows/report-backend-memory.yml

jobs:
  get-memory-usage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379

    steps:
      - name: Checkout base
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.base_ref }}
          path: base
          submodules: true
      - name: Checkout head
        uses: actions/checkout@v6.0.2
        with:
          ref: refs/pull/${{ github.event.number }}/merge
          path: head
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: head/.bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install base dependencies
        working-directory: base
        run: bun install --frozen-lockfile
      - name: Check base bun.lock
        working-directory: base
        run: git diff --exit-code bun.lock
      - name: Configure base
        working-directory: base
        run: |
          cp .github/misskey/test.yml .config/default.yml
          bun run compile-config
      - name: Build base
        working-directory: base
        run: bun run build
      - name: Install head dependencies
        working-directory: head
        run: bun install --frozen-lockfile
      - name: Check head bun.lock
        working-directory: head
        run: git diff --exit-code bun.lock
      - name: Configure head
        working-directory: head
        run: |
          cp .github/misskey/test.yml .config/default.yml
          bun run compile-config
      - name: Build head
        working-directory: head
        run: bun run build
      - name: Measure backend memory usage
        env:
          MK_MEMORY_COMPARE_ROUNDS: 5
          MK_MEMORY_COMPARE_WARMUP_ROUNDS: 1
          MK_MEMORY_HEAP_SNAPSHOT: 1
        run: bun head/.github/scripts/measure-backend-memory-comparison.mts base head memory-base.json memory-head.json
      - name: Upload head heap snapshot
        uses: actions/upload-artifact@v7
        with:
          name: backend-memory-head-heap-snapshot
          path: head-heap-snapshot.heapsnapshot
          if-no-files-found: error
          retention-days: 7
      - name: Measure backend loaded JS footprint
        run: |
          bun head/.github/scripts/backend-js-footprint.mjs base js-footprint-base.json
          bun head/.github/scripts/backend-js-footprint.mjs head js-footprint-head.json
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: memory-artifact-results
          path: |
            memory-base.json
            memory-head.json
            js-footprint-base.json
            js-footprint-head.json

  save-pr-number:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "$PR_NUMBER" > ./pr_number
      - uses: actions/upload-artifact@v7
        with:
          name: memory-artifact-pr-number
          path: pr_number
