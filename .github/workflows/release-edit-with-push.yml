name: 'Release Manager: sync changelog with PR'

on:
  push:
    branches:
      - develop
    paths:
      - 'CHANGELOG.md'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # headが$GITHUB_REF_NAME, baseが$STABLE_BRANCHかつopenのPRを1つ取得
      - name: Get PR
        run: |
          echo "pr_number=$(gh pr list --limit 1 --search "head:$GITHUB_REF_NAME base:$STABLE_BRANCH is:open" --json number  --jq '.[] | .number')" >> $GITHUB_OUTPUT
        id: get_pr
        env:
          STABLE_BRANCH: ${{ vars.STABLE_BRANCH }}
      - name: Get target version
        if: steps.get_pr.outputs.pr_number != ''
        run: echo "target_version=$(jq -r '.version | split("-")[0]' package.json)" >> "$GITHUB_OUTPUT"
        id: v
      - name: Get changelog
        if: steps.get_pr.outputs.pr_number != ''
        run: |
          {
            echo 'changelog<<EOF'
            sed -n "/## $VERSION/,/^## /p" CHANGELOG.md | sed -e 1d -e '$d'
            echo EOF
          } >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.v.outputs.target_version }}
        id: changelog
      - name: Update PR
        if: steps.get_pr.outputs.pr_number != ''
        run: |
          gh pr edit "$PR_NUMBER" --body "$CHANGELOG"
        env:
          PR_NUMBER: ${{ steps.get_pr.outputs.pr_number }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
