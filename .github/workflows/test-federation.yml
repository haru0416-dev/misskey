name: Test (federation)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/workflows/test-federation.yml
  pull_request:
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/workflows/test-federation.yml
  workflow_dispatch:

jobs:
  test:
    name: Federation test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install FFmpeg
        run: |
          sudo apt install -y ffmpeg
      - name: Build Misskey
        # fed コンテナがマウントするのは built/ (backend) + misskey-js/built + i18n/built のみで、
        # フロントエンドの vite ビルドは不要 (test-backend.yml と同じ絞り込み)。
        run: |
          bun install --frozen-lockfile
          bun run build-pre && bun run build:backend-deps && bun run --bun --filter backend build
      - name: Setup
        run: |
          echo "BUN_VERSION=$(cat .bun-version)" >> $GITHUB_ENV
          cd packages/backend/test-federation
          bash ./setup.sh
          sudo chmod 644 ./certificates/*.test.key
      - name: Start servers
        id: start_servers
        continue-on-error: true
        # https://github.com/docker/compose/issues/1294#issuecomment-374847206
        run: |
          cd packages/backend/test-federation
          docker compose up -d --scale tester=0
      - name: Print start_servers error
        if: ${{ steps.start_servers.outcome == 'failure' }}
        run: |
          cd packages/backend/test-federation
          docker compose logs | tail -n 300
          exit 1
      - name: Test
        run: |
          cd packages/backend/test-federation
          docker compose run --no-deps tester
      - name: Log
        if: always()
        run: |
          cd packages/backend/test-federation
          docker compose logs
      - name: Stop servers
        if: always()
        run: |
          cd packages/backend/test-federation
          docker compose down
