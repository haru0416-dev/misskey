name: Test (federation)

on:
  push:
    branches: [master, develop]
    paths: &federation-paths
      - packages/backend/**
      - packages/misskey-js/**
      - packages/slacc/**
      - packages/mfm-js/**
      - packages/i18n/**
      - bun.lock
      - .gitmodules
      - bunfig.toml
      - .bun-version
      - package.json
      - Dockerfile
      - patches/**
      - scripts/**
      - deploy/healthcheck.sh
      - .github/workflows/test-federation.yml
  pull_request:
    paths: *federation-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Federation fork ↔ ${{ matrix.peer }}
    runs-on: ubuntu-latest
    # 相手の起動や配送が進まない場合も、CI のデフォルトの上限まで滞留させない。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        peer: [fork, upstream]
    env:
      FEDERATION_PEER_B_KIND: ${{ matrix.peer }}
      COMPOSE_FILE: compose.matrix.yml
      COMPOSE_PROJECT_NAME: federation-${{ matrix.peer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      # サーバーはコンテナ内の oven/bun で動くため、ランナーへの FFmpeg の導入は不要。
      - name: Setup
        run: |
          echo "BUN_VERSION=$(cat .bun-version)" >> "$GITHUB_ENV"
          cd packages/backend/test-federation
          bash ./setup.sh
          sudo chmod 644 ./certificates/*.test.key
      # イメージ取得をビルドと並行させ、起動前に取得完了を待つ。
      - name: Pull peer images in the background
        working-directory: packages/backend/test-federation
        run: |
          nohup docker compose pull --quiet > results/pull.log 2>&1 &
          echo $! > results/pull.pid
      - name: Build Misskey
        run: |
          bun install --frozen-lockfile
          bun run --filter slacc build
          bun run build-pre && bun run build:backend-deps && bun run --bun --filter backend build
      - name: Start isolated peers
        working-directory: packages/backend/test-federation
        run: |
          pid=$(cat results/pull.pid)
          while kill -0 "$pid" 2> /dev/null; do sleep 1; done
          cat results/pull.log
          docker compose up -d --wait --wait-timeout 240 --scale tester=0
      - name: Record resolved peers
        working-directory: packages/backend/test-federation
        run: |
          git rev-parse HEAD > results/fork-revision.txt
          docker compose config > results/compose.yml
          docker compose images --format json > results/images.json
          cp upstream.json results/upstream-identity.json
      - name: Test both sender directions
        working-directory: packages/backend/test-federation
        # 公式 upstream 側の既知の不具合はテストを弱めずに失敗として残し、合否は次の照合で決める。
        continue-on-error: ${{ matrix.peer == 'upstream' }}
        run: docker compose run --no-deps --rm tester
      - name: Compare with known upstream failures
        if: matrix.peer == 'upstream' && !cancelled()
        run: bun scripts/check-federation-known-failures.mjs packages/backend/test-federation/results/upstream.json packages/backend/test-federation/known-upstream-failures.json
      - name: Collect peer logs
        if: always()
        working-directory: packages/backend/test-federation
        run: |
          mkdir -p results
          docker compose logs --no-color > results/peers.log 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: federation-${{ matrix.peer }}-${{ github.sha }}
          path: packages/backend/test-federation/results/
