name: Test (shuffled order)

# テストの実行順を入れ替えて、テスト同士の順序依存を見つける。通常の CI は毎回同じ順で走るので、
# 前のテストが残した行やモックに頼って通るテストに気づけない。
# 失敗したら、ジョブの概要に出る seed で `--sequence.shuffle --sequence.seed=<seed>` を付けて再現する。
on:
  schedule:
    # 毎週水曜 09:00 (JST)
    - cron: '0 0 * * 3'
  workflow_dispatch:
    inputs:
      seed:
        description: 実行順の seed (空なら毎回変える)
        required: false
        type: string

permissions:
  contents: read

jobs:
  backend-unit:
    name: Unit tests (backend, shuffled ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      valkey:
        image: valkey/valkey:8
        ports:
          - 56312:6379
      meilisearch:
        image: getmeili/meilisearch:v1.42.1
        ports:
          - 57712:7700
        env:
          MEILI_NO_ANALYTICS: true
          MEILI_ENV: development
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Choose seed
        env:
          INPUT_SEED: ${{ inputs.seed }}
          RUN: ${{ matrix.run }}
        run: |
          # 指定があれば各ジョブで seed をずらし、無ければ run_id から決める (再実行でも同じ順になる)。
          base="${INPUT_SEED:-$GITHUB_RUN_ID}"
          seed=$(( (base + RUN) % 2147483647 ))
          echo "SEED=$seed" >> "$GITHUB_ENV"
          echo "backend unit seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install FFmpeg
        run: sudo apt install -y ffmpeg
      - run: bun install --frozen-lockfile
      - name: Build slacc
        # リポジトリ内でビルドするネイティブモジュール。backend の実行に必要。
        run: bun run --filter slacc build
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build-pre && bun run build:backend-deps && bun run --bun --filter backend build
      - name: Test
        run: bun run --bun --filter backend test --sequence.shuffle --sequence.seed="$SEED"

  frontend-unit:
    name: Unit tests (frontend, shuffled ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Choose seed
        env:
          INPUT_SEED: ${{ inputs.seed }}
          RUN: ${{ matrix.run }}
        run: |
          base="${INPUT_SEED:-$GITHUB_RUN_ID}"
          seed=$(( (base + RUN) % 2147483647 ))
          echo "SEED=$seed" >> "$GITHUB_ENV"
          echo "frontend unit seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Copy Configure
        run: cp .github/misskey/test.yml .config
      - name: Build
        run: bun run build-pre && bun run build:frontend-deps
      - name: Test
        run: bun run --bun --filter frontend test --sequence.shuffle --sequence.seed="$SEED"
