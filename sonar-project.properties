# SonarQube (SonarJS) 解析設定。
# ローカルサーバーの起動手順は dev/sonarqube/README.md を参照。

sonar.projectKey=misskey
sonar.projectName=Misskey
sonar.sourceEncoding=UTF-8

# 一次開発コードのみを対象にする (aiscript / mfm-js は上流ライブラリのベンダー取り込みなので除外)
sonar.sources=\
	packages/backend/src,\
	packages/frontend/src,\
	packages/frontend-embed/src,\
	packages/frontend-shared,\
	packages/sw/src,\
	packages/misskey-js/src,\
	packages/i18n/src,\
	packages/icons-subsetter/src,\
	scripts

sonar.tests=\
	packages/backend/test,\
	packages/frontend/test,\
	packages/misskey-js/test,\
	tests/e2e

# 生成物・ビルド成果物・Storybook スタブは解析しない
sonar.exclusions=\
	**/node_modules/**,\
	**/built/**,\
	**/built-test/**,\
	**/js-built/**,\
	**/*.stories.ts,\
	**/*.stories.impl.ts,\
	packages/misskey-js/src/autogen/**,\
	packages/frontend/src/**/*.json5,\
	packages/backend/test-federation/volumes/**

sonar.typescript.tsconfigPaths=\
	packages/backend/tsconfig.json,\
	packages/frontend/tsconfig.json,\
	packages/frontend-embed/tsconfig.json,\
	packages/sw/tsconfig.json,\
	packages/misskey-js/tsconfig.json,\
	packages/i18n/tsconfig.json,\
	packages/icons-subsetter/tsconfig.json,\
	packages/backend/test/tsconfig.json,\
	packages/frontend/test/tsconfig.json,\
	tests/e2e/tsconfig.json

# monorepo 全体を一度に読むため既定の 8000 では足りない
sonar.javascript.node.maxspace=8192

# ルール単位の除外。無効化するほどではないが特定のファイル種別でだけ誤検出するもの。
# 有効・無効そのものの管理は dev/sonarqube/rule-overrides.json 側。
sonar.issue.ignore.multicriteria=vueUnusedImport

# SonarJS は <script setup> の import がテンプレートで使われていることを追えないため、
# .vue では未使用 import 検出が総崩れになる (.ts では実際に死んだ import を拾えている)
sonar.issue.ignore.multicriteria.vueUnusedImport.ruleKey=typescript:S1128
sonar.issue.ignore.multicriteria.vueUnusedImport.resourceKey=**/*.vue
