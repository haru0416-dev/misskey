<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
	<title id="title">Erebia</title>
	<defs>
		<linearGradient id="er-bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#191b2e"/>
			<stop offset="1" stop-color="#0a0b13"/>
		</linearGradient>
		<radialGradient id="er-glow" cx="0.5" cy="1.2" r="1">
			<stop offset="0" stop-color="#5c62d8" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#5c62d8" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="er-mark" gradientUnits="userSpaceOnUse" x1="64" y1="37" x2="64" y2="91">
			<stop offset="0" stop-color="#f5f6ff"/>
			<stop offset="1" stop-color="#a9adf5"/>
		</linearGradient>
