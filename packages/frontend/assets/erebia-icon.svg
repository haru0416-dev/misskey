	<g transform="translate(64 64) skewX(-10) translate(-64 -64)" fill="url(#er-mark)">
		<rect x="35" y="36" width="58" height="14" rx="7"/>
		<rect x="35" y="57" width="43" height="14" rx="7"/>
		<rect x="35" y="78" width="58" height="14" rx="7"/>
	</g>
