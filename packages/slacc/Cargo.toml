[package]
edition = "2021"
name = "slacc"
version = "0.2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
aws-lc-rs = { version = "1.18.0", default-features = false, features = [
	"alloc",
	"aws-lc-sys",
	"prebuilt-nasm",
	"ring-io",
	"ring-sig-verify",
] }
napi = { version = "3.12.2", default-features = false, features = ["napi10"] }
napi-derive = "3.6.3"
pkcs8 = { version = "0.10.2", default-features = false, features = ["alloc", "pem", "std"] }
rayon = "1.12.0"
spki = { version = "0.8.0", default-features = false, features = ["alloc", "digest", "fingerprint", "pem", "std"] }
zip = "8.6.0"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = "fat"
codegen-units = 1
# デバッグシンボルは実行時に使わない。実測でバイナリが 3.98MB → 3.67MB。
# 速度は 3 回ずつ交互に測って全項目で範囲が重なり、差は確認できなかった。
strip = true
# panic = "abort" は使わない。スレッドプール内の panic がサーバー全体を落とすため。
