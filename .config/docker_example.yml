configVersion: 2

instance:
  url: https://example.tld
  setupPassword:
    fromEnvironment: EREBIA_SETUP_PASSWORD

server:
  listen:
    tcp:
      address: 0.0.0.0
      port: 3000

database:
  primary:
    host: db
    port: 5432
    name: misskey
    user: example-misskey-user
    password:
      fromEnvironment: DATABASE_PASSWORD

valkey:
  connections:
    primary:
      host: valkey
      port: 6379

search:
  provider: sqlLike

outboundNetwork:
  proxy:
    bypassHosts:
      - api.deepl.com
      - api-free.deepl.com
      - www.recaptcha.net
      - hcaptcha.com
      - challenges.cloudflare.com
