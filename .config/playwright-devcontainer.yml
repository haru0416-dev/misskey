configVersion: 2

instance:
  url: http://misskey.local
  setupPassword:
    plainText: example_password_please_change_this_or_you_will_get_hacked

server:
  listen:
    tcp:
      address: 0.0.0.0
      port: 61812

database:
  primary:
    host: db
    port: 5432
    name: misskey
    user: postgres
    password:
      plainText: postgres

valkey:
  connections:
    primary:
      host: valkey
      port: 6379

outboundNetwork:
  privateNetworkAccess:
    allowedNetworks:
      - 127.0.0.1/32
      - 172.16.0.0/12
