x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    build: ..
    restart: unless-stopped
    #     - mcaptcha
    #     - meilisearch
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - internal_network
      - external_network
    # env_file:
    #   - ../.config/docker.env
    volumes:
      - ../files:/misskey/files
      - ../.config:/misskey/.config:ro
    stop_grace_period: 30s
    logging: *default-logging

  valkey:
    restart: unless-stopped
    image: valkey/valkey:8-alpine
    networks:
      - internal_network
    volumes:
      # Keep the existing path so upgrades reuse Redis-compatible persisted data.
      - ../redis:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20
    stop_grace_period: 30s
    logging: *default-logging

  db:
    restart: unless-stopped
    image: postgres:18-alpine
    networks:
      - internal_network
    env_file:
      - ../.config/docker.env
    volumes:
      - ../db:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    stop_grace_period: 60s
    logging: *default-logging

