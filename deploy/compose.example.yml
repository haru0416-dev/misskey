x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # HTTPS は前段のリバースプロキシで付ける。nginx の設定例は nginx.md を参照。
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - internal_network
      - external_network
    env_file:
      - ../.config/docker.env
    volumes:
      - ../files:/misskey/files
      - ../.config:/misskey/.config:ro
    stop_grace_period: 30s
    logging: *default-logging

  valkey:
    restart: unless-stopped
    image: valkey/valkey:8-alpine
    networks:
      - internal_network
    volumes:
      # Redis 互換の永続データを更新後も再利用するため、既存のパスを維持する。
      - ../redis:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 20
    stop_grace_period: 30s
    logging: *default-logging

  db:
    restart: unless-stopped
    image: postgres:18-alpine
    networks:
      - internal_network
    env_file:
      - ../.config/docker.env
    volumes:
      - ../db:/var/lib/postgresql
    shm_size: 256mb
    # 受信・投稿のたびに更新される index のページがキャッシュに収まらないと、1 件ごとに数十枚が書き出される。
    # キャッシュをメモリの 1/4 程度に増やしチェックポイントの間隔を延ばすと、同じページの書き出しがまとまる。
    # shared_buffers はサーバーのメモリに合わせて決めること (メモリを超えると起動しない)。目安はメモリの 1/4 で、
    # メモリ 1GB なら 256MB、2GB なら 512MB、4GB なら 1GB。
    # jit と work_mem はデフォルトのままでよい。
    # command: postgres -c shared_buffers=1GB -c checkpoint_timeout=15min
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    stop_grace_period: 60s
    logging: *default-logging

# Capはcompose.cap.ymlで別サービスとして起動する。設定手順はcap.mdを参照。

networks:
  internal_network:
    internal: true
  external_network:
